{{ define "main" }}
<article class="home-intro">
  <header class="page-header"><h1>{{ .Title }}</h1></header>
  <div class="post-content">
    <img class="home-portrait" src="{{ "profile_picture.JPG" | relURL }}" alt="Eric Taylor in the mountains" width="160" height="160">
    {{ .Content }}
  </div>
</article>
{{ end }}
