<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body class="earth {{ if .IsHome }}earth-home{{ else }}earth-{{ .Section | default .Kind }}{{ end }}" id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {{ partial "header.html" . }}
    <main class="main" id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
