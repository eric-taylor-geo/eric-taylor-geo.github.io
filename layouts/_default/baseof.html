<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body class="earth {{ if .IsHome }}earth-home{{ else }}earth-{{ .Section | default .Kind }}{{ end }}" id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {{ if ne .Section "publications" }}
      {{ partial "header.html" . }}
    {{ end }}
    <main class="main" id="main" tabindex="-1">
      {{ if and (eq .Section "publications") (ne . .FirstSection) }}
      <nav class="publication-back" aria-label="Back navigation">
        <a href="{{ .FirstSection.RelPermalink }}">← Back to publications</a>
      </nav>
      {{ end }}
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
